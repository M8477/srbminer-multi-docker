services:
  srbminer:
    image: ghcr.io/m8477/srbminer-multi-docker:latest
    pull_policy: always
    container_name: srbminer
    init: true
    privileged: true
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri/renderD129:/dev/dri/renderD129
    security_opt:
      - seccomp:unconfined
    group_add:
      - video
    environment:
      - ALGO=randomx
      - POOL_ADDRESS=stratum+tcp://rx.unmineable.com:3333
      - WALLET_USER=BTC:${BTC_ADDRESS:-}
      - WORKER_NAME=${WORKER_NAME}
      - POOL_PASSWORD=x
      - EXTRAS=--disable-gpu --api-enable --api-port 21550 --extended-log
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - VERSION_TAG=${VERSION_TAG:-3.2.8}
      - HSA_ENABLE_SDMA=0
      - ROCR_VISIBLE_DEVICES=0
      - HIP_VISIBLE_DEVICES=0
    restart: "no"
    tty: true
    stdin_open: true
    ports:
      - "21550:21550"

  solar-controller:
    image: ghcr.io/m8477/solar-controller:latest
    pull_policy: always
    container_name: solar-controller
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PYTHONUNBUFFERED=1
      - HA_URL=${HA_URL}
      - HA_TOKEN=${HA_TOKEN}
      - BATTERY_ENTITY=${BATTERY_ENTITY}
      - SOLAR_ENTITY=${SOLAR_ENTITY}
      - BATTERY_MIN=${BATTERY_MIN:-90}
      - SOLAR_MIN=${SOLAR_MIN:-800}
      - CHECK_SECS=${CHECK_SECS:-120}
      - FORCE_MINE=${FORCE_MINE:-}
      - FORCE_MINE_MINS=${FORCE_MINE_MINS:-30}
      - HEARTBEAT_SECS=${HEARTBEAT_SECS:-60}
      - API_PORT=${API_PORT:-21550}
    restart: unless-stopped

  kraken-sell-bot:
    image: ghcr.io/m8477/kraken-sell-bot:latest
    pull_policy: always
    container_name: kraken-sell-bot
    environment:
      - PYTHONUNBUFFERED=1
      - KRAKEN_KEY=${KRAKEN_KEY}
      - KRAKEN_SECRET=${KRAKEN_SECRET}
      - MIN_BTC_SELL=${MIN_BTC_SELL:-0.0005}
    restart: unless-stopped
