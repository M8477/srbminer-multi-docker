name: Docker Publish

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: srbminer-multi-docker
            context: .
            dockerfile: Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: solar-controller
            context: ./solar-controller
            dockerfile: ./solar-controller/Dockerfile
            platforms: linux/amd64
          - image: kraken-sell-bot
            context: ./kraken-sell-bot
            dockerfile: ./kraken-sell-bot/Dockerfile
            platforms: linux/amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract SRBMiner version from Dockerfile
        id: srbversion
        run: |
          VERSION=$(grep -oP 'ARG VERSION_TAG=\K[0-9.]+' Dockerfile || echo '')
          MD5=$(grep -oP 'ARG EXPECTED_MD5=\K[0-9a-f]+' Dockerfile || echo '')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "md5=$MD5" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta for ${{ matrix.image }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            ${{ matrix.image == 'srbminer-multi-docker' && format('type=raw,value={0}', steps.srbversion.outputs.version) || '' }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          build-args: |
            VERSION_TAG=${{ steps.srbversion.outputs.version }}
            EXPECTED_MD5=${{ steps.srbversion.outputs.md5 }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
